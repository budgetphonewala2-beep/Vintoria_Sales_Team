name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the official Agent Skills validator
        run: python -m pip install skills-ref
      - name: Validate every skill (Agent Skills spec)
        run: for d in skills/*/; do skills-ref validate "$d"; done
