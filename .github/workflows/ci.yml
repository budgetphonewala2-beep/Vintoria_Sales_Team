name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt pytest skills-ref
      - name: Generated skills are up to date
        run: python tools/build_skills.py --check
      - name: Validate skills (Agent Skills spec + portability)
        run: python tools/validate_skills.py
      - name: Tests
        run: python -m pytest -q tests
